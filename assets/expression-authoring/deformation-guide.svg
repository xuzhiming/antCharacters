<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><rect width="1200" height="950" fill="#172130"/><g font-family="sans-serif" fill="#edf4ff"><text x="30" y="42" font-size="25">表情を支える皮膚まで、滑らかにつなぎます</text><text x="35" y="90" font-size="19">1段に集中した変形</text><text x="430" y="90" font-size="19">既存の複数列へ分散</text><text x="830" y="90" font-size="19">頭部の曲面に沿う奥行き</text></g><g fill="#ebbec8" stroke="#765f74" stroke-width="2"><path d="M40 130H350V410H40Z"/><path d="M435 130H745V410H435Z"/></g><g fill="none" stroke="#635471" stroke-width="2"><path d="M40 160H350M40 190H350M40 220H350M40 250H350M40 280H350M80 130V410M120 130V410M160 130V410M200 130V410M240 130V410M280 130V410M320 130V410"/><path d="M435 170H745M435 215H745M435 260H745M435 305H745M435 355H745M475 130V410M515 130V410M555 130V410M595 130V410M635 130V410M675 130V410M715 130V410"/></g><g fill="none" stroke-width="6"><path d="M45 390Q195 440 345 390" stroke="#843a55"/><path d="M440 390Q590 440 740 390" stroke="#843a55"/><path d="M88 285V370M160 285V380M240 285V380M310 285V370" stroke="#f14f6c"/><path d="M485 195V220M555 240V270M625 290V325M695 335V370" stroke="#309b87"/><path d="M1000 120C935 165 925 240 935 280C940 305 920 320 910 337C895 359 901 381 926 397L942 440" stroke="#e9b4c4" stroke-width="11"/><path d="M1053 240V355" stroke="#f14f6c" stroke-dasharray="10 9"/><path d="M1040 278Q1000 290 958 334" stroke="#73d9c0"/><path d="M957 313L953 340L979 330" stroke="#73d9c0"/></g><g font-family="sans-serif" fill="#c5d2e5" font-size="17"><text x="35" y="482">縁だけを強く引くと、長い面と</text><text x="35" y="511">伸びた描画が残ります。</text><text x="430" y="482">支持列も動かし、周辺を選び直して</text><text x="430" y="511">戻す補正を重ねます。</text><text x="830" y="482">上下移動の後は斜め・横で確認し、</text><text x="830" y="511">前後位置と厚みも整えます。</text></g><g transform="translate(0 555)" font-family="sans-serif"><g fill="#edf4ff" font-size="19"><text x="35" y="35">本来の口縁を試し変形で確定</text><text x="430" y="35">まつ毛と皮膚を順に調整</text><text x="830" y="35">点の正体は奥行きで検証</text></g><g fill="none" stroke-width="4"><path d="M70 130Q190 60 325 130Q190 205 70 130Z" stroke="#f4b8c5"/><path d="M70 130Q190 150 325 130" stroke="#72d6bd"/><path d="M80 178Q190 210 315 178" stroke="#f14f6c" stroke-dasharray="9 7"/><path d="M445 105Q585 75 735 105M445 145Q585 115 735 145M445 185Q585 155 735 185" stroke="#bd91aa"/><path d="M445 220Q585 250 735 220" stroke="#843a55" stroke-width="9"/><path d="M490 115V162M580 135V185M670 115V162" stroke="#72d6bd"/><path d="M880 110Q940 140 990 235" stroke="#e9b4c4" stroke-width="10"/><path d="M970 112L1020 150L990 195Z" stroke="#f14f6c"/><path d="M1040 110L1070 150L1040 190Z" stroke="#72d6bd"/><path d="M998 150H1033" stroke="#72d6bd"/></g><g fill="#c5d2e5" font-size="16"><text x="35" y="286">緑：接触する実際の唇。赤：描画だけの候補。</text><text x="35" y="315">ソリッドで開閉し、面の接続を確認します。</text><text x="430" y="286">離れた部品へ同じ移動を一律適用せず、</text><text x="430" y="315">皮膚・縁・厚みを複数方向から整えます。</text><text x="830" y="286">黒点＝まつ毛とは限りません。</text><text x="830" y="315">虹彩の面・頂点と皮膚を照合し、</text><text x="830" y="344">閉眼キーだけで内側へ収めます。</text></g></g></svg>
